<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library Home demo</title>
<link rel="stylesheet" href="/home/assets/fonts.css">
<link rel="stylesheet" href="/home/assets/typefaces.css">
<link rel="stylesheet" href="library.css">
</head>
<body>
<main class="stage" id="stage" tabindex="0" aria-label="TV stage, 1920 by 1080. Use the arrow keys, Enter for OK and Escape for Back.">
  <div class="bg" aria-hidden="true">
    <img class="bg-photo" id="photoA" alt="">
    <img class="bg-photo" id="photoB" alt="">
    <img class="bg-blur" id="blur" alt="">
    <div class="bg-veil"></div>
    <div class="bg-shade"></div>
    <div class="bg-scrim"></div>
  </div>

  <div class="ui">
    <div class="page" id="page">
      <div class="dock" id="dock">
        <div class="glass dock-glass"><img class="glass-img" id="dockGlass" data-material="soft" alt=""><div class="glass-veil"></div></div>
        <div class="tiles fav-tiles" id="favRow"></div>
        <div class="tiles in-tiles" id="inRow"></div>
      </div>
      <div class="library" id="library"></div>
      <div class="focus-name" id="focusName" aria-hidden="true"></div>
    </div>

    <header class="topbar">
      <nav class="nav glass" aria-label="Sections">
        <img class="glass-img" data-material="frost" alt=""><div class="glass-veil"></div>
        <div class="pills" id="pills"></div>
      </nav>
      <div class="status">
        <div class="gear glass" id="gear" data-z="gear" role="button" aria-label="Settings">
          <img class="glass-img" data-material="frost" alt=""><div class="glass-veil"></div>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.6 2.4-2 1.2L4 6l-2 3.5L3.8 11v2L2 14.5 4 18l2.4-.6 2 1.2L9 21h6l.6-2.4 2-1.2 2.4.6 2-3.5-1.8-1.5v-2L22 9.5 20 6l-2.4.6-2-1.2L15 3Z"/><circle cx="12" cy="12" r="3.2"/></svg>
        </div>
        <div class="weather" aria-label="Partly cloudy, 64 degrees">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2.6v1.6M3.3 4.6l1.1 1.1M1.6 9.2h1.6M12.7 4.6l-1.1 1.1"/><path d="M4.9 11.6A3.7 3.7 0 0 1 11.7 7"/><path d="M7.6 20.4h9.9a4 4 0 0 0 .7-7.9 5.4 5.4 0 0 0-10.4 1A3.5 3.5 0 0 0 7.6 20.4Z"/></svg>
          <span>64°</span>
        </div>
        <div class="time" id="time"></div>
      </div>
    </header>
  </div>

  <div class="ambient" aria-hidden="true">
    <div class="amb-shade"></div>
    <div class="amb-drift" id="ambDrift">
      <div class="amb-caption"><div class="amb-title" id="ambTitle"></div><div class="amb-credit" id="ambCredit"></div></div>
      <div class="amb-clock">
        <div class="amb-weather">
          <svg class="ico" viewBox="0 0 24 24"><path d="M8 2.6v1.6M3.3 4.6l1.1 1.1M1.6 9.2h1.6M12.7 4.6l-1.1 1.1"/><path d="M4.9 11.6A3.7 3.7 0 0 1 11.7 7"/><path d="M7.6 20.4h9.9a4 4 0 0 0 .7-7.9 5.4 5.4 0 0 0-10.4 1A3.5 3.5 0 0 0 7.6 20.4Z"/></svg>
          <span>64°</span>
        </div>
        <div class="amb-time" id="ambTime"></div>
      </div>
    </div>
  </div>

  <aside class="panel glass" aria-label="Settings">
    <img class="glass-img" data-material="frost" alt=""><div class="glass-veil"></div>
    <h2 class="p-title">Settings</h2>
    <div class="p-rows" id="panelRows"></div>
  </aside>

  <div class="dialog glass" role="dialog" aria-labelledby="dialogTitle">
    <img class="glass-img" data-material="frost" alt=""><div class="glass-veil"></div>
    <h2 class="d-title" id="dialogTitle">Open Samsung Home?</h2>
    <p class="d-text">Press Home on the remote to come back here.</p>
    <div class="d-actions" id="dialogActions">
      <div class="d-btn" data-z="dialog" data-i="0">Stay here</div>
      <div class="d-btn" data-z="dialog" data-i="1">Samsung Home</div>
    </div>
  </div>

  <div class="toast" id="toast" aria-live="polite"><span></span></div>
</main>

<div class="hints" id="hints"><b>Arrows</b> move · <b>Enter</b> OK · <b>Esc</b> Back · <b>A</b> ambient · <b>H</b> hide this · Sample apps, inputs and weather</div>

<script src="/home/assets/icons/metrics.js"></script>
<script src="/home/assets/wallpapers/catalog.js"></script>
<script src="library.js"></script>
</body>
</html>
